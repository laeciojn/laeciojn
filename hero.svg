<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .mono { font-family: 'JetBrains Mono','Cascadia Code','SF Mono',Consolas,Menlo,monospace; }
    .sans { font-family: 'Segoe UI','Inter',Ubuntu,'Helvetica Neue',Arial,sans-serif; }
    .name { font-size: 46px; font-weight: 700; fill: #E8EEF6; letter-spacing: -1px; }
    .role { font-size: 18px; fill: #8A9AB3; }
    .log  { font-size: 14px; fill: #C9D4E3; }
    .ts   { fill: #5B6B82; }
    .info { fill: #6DB33F; font-weight: 700; }
    .ok   { fill: #6DB33F; }
    .amber{ fill: #F2A65A; }
    .line { opacity: 0; animation: show .25s ease-out forwards; }
    .l1 { animation-delay: .6s; }  .l2 { animation-delay: 1.3s; }
    .l3 { animation-delay: 2.0s; } .l4 { animation-delay: 2.7s; }
    .l5 { animation-delay: 3.6s; } .l6 { animation-delay: 4.2s; }
    .head { opacity: 0; animation: rise .8s ease-out forwards; }
    .head2 { animation-delay: .2s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .bar { transform-origin: 40px 0; transform: scaleX(0); animation: grow 3.4s cubic-bezier(.4,0,.2,1) .4s forwards; }
    @keyframes show { from { opacity: 0; transform: translateX(-6px);} to { opacity: 1; transform: none; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .line, .head { animation: none; opacity: 1; }
      .bar { animation: none; transform: none; }
      .cursor { animation: none; }
    }
  </style>

  <!-- janela -->
  <rect x="1" y="1" width="898" height="378" rx="14" fill="#0E1726" stroke="#1E2A3D" stroke-width="2"/>
  <path d="M1 15a14 14 0 0 1 14-14h870a14 14 0 0 1 14 14v25H1z" fill="#131E31"/>
  <circle cx="26" cy="21" r="5.5" fill="#2A3850"/>
  <circle cx="44" cy="21" r="5.5" fill="#2A3850"/>
  <circle cx="62" cy="21" r="5.5" fill="#2A3850"/>
  <text x="450" y="26" text-anchor="middle" class="mono" font-size="12" fill="#5B6B82">LaecioApplication.java  ▸  Run</text>

  <!-- identidade -->
  <text x="40" y="104" class="sans name head">Laécio Neves</text>
  <text x="42" y="136" class="sans role head head2">Desenvolvedor backend Java em Brasília, DF</text>

  <!-- barra de progresso do boot -->
  <rect x="40" y="160" width="820" height="2" fill="#1E2A3D"/>
  <rect x="40" y="160" width="820" height="2" fill="#F2A65A" class="bar"/>

  <!-- log de inicialização -->
  <g class="mono log" xml:space="preserve">
    <text x="40" y="200" class="line l1"><tspan class="ts">09:00:01</tspan>  <tspan class="info">INFO</tspan>  Starting LaecioApplication using <tspan class="amber">Java</tspan></text>
    <text x="40" y="226" class="line l2"><tspan class="ts">09:00:01</tspan>  <tspan class="info">INFO</tspan>  Backend: Spring Boot, JPA/Hibernate, REST, PostgreSQL</text>
    <text x="40" y="252" class="line l3"><tspan class="ts">09:00:02</tspan>  <tspan class="info">INFO</tspan>  Automação: Python, Playwright, N8N, Power Automate</text>
    <text x="40" y="278" class="line l4"><tspan class="ts">09:00:02</tspan>  <tspan class="info">INFO</tspan>  Processos: BPMN, SAP, Pipefy, Scrum</text>
    <text x="40" y="310" class="line l5"><tspan class="ts">09:00:03</tspan>  <tspan class="info">INFO</tspan>  <tspan class="ok">Started LaecioApplication in 2.1 seconds ✔</tspan></text>
    <text x="40" y="346" class="line l6"><tspan class="amber">$</tspan> aberto a oportunidades em backend<tspan class="cursor amber"> ▌</tspan></text>
  </g>
</svg>
